{% extends 'base_generic.html' %}
{% block title %}Edit {{ book.title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-center">✏️ Edit Book</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex justify-center mt-4">
      <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
