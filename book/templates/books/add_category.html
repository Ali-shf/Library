{% extends 'base_generic.html' %}
{% block title %}Add Category{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold mb-6 text-center">Add New Category</h2>

<form method="POST" class="max-w-md mx-auto bg-white p-6 rounded shadow">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Add Category</button>
</form>
{% endblock %}
